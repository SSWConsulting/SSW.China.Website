# ssw.cn/admin → 可视化编辑预览站（Vercel）的反向代理。DECISIONS §116，步骤见 docs/DEPLOY-SETUP.md。
#
# 放进 ssw.cn 那个 server { } 块里（和现有的 location 并列），然后 nginx -t、nginx -s reload。
# 撤回：删掉这几段再 reload，/admin/ 回到站点目录里的跳转页（§113）。
#
# 一律用 ^~：server 块里若有按扩展名匹配的正则 location（如给 js/css 设缓存），
# 不加 ^~ 时正则会优先，把 /admin/ 下的 js/css 当本地文件找而 404。

# 解析 Vercel 域名用的 DNS（阿里 DNS）。proxy_pass 用变量 ⇒ 按 TTL 重新解析，Vercel 换 IP 不用重启 nginx。
resolver 223.5.5.5 223.6.6.6 valid=300s ipv6=off;
resolver_timeout 5s;

# 表单编辑后台：仍由站点目录提供，不经过 Vercel。前缀比 /admin/ 长，优先匹配。
location ^~ /admin/forms/ {
}

# 后台本身（/admin/index.html、/admin/assets/…、/admin/bridge.js）
# 与预览页（/admin/preview/…）都在预览站上。
location ^~ /admin/ {
    set $ssw_preview ssw-china-preview.vercel.app;
    proxy_pass https://$ssw_preview;
    proxy_http_version 1.1;
    proxy_set_header Host $ssw_preview;
    proxy_ssl_server_name on;
    proxy_ssl_name $ssw_preview;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}

# 预览的实时重渲染端点：后台每次输入都 POST 到这里。
location ^~ /tina-island/ {
    set $ssw_preview ssw-china-preview.vercel.app;
    proxy_pass https://$ssw_preview;
    proxy_http_version 1.1;
    proxy_set_header Host $ssw_preview;
    proxy_ssl_server_name on;
    proxy_ssl_name $ssw_preview;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}
