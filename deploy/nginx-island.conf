# ssw.cn 可视化编辑：把 /tina-island/ 转给本机的预览服务（DECISIONS §117，步骤见 docs/DEPLOY-SETUP.md）。
#
# 放进 ssw.cn 那个 server { } 块里（和现有的 location 并列），然后 nginx -t、nginx -s reload。
# /admin/ 与 /admin/preview/ 是普通静态文件，随网站一起发布，不需要额外配置。
# 撤回：删掉这一段再 reload。后台仍能打开，只是右侧预览不再随输入更新（表单编辑用 /admin/forms/）。
#
# 用 ^~：server 块里若有正则 location，不加时正则可能优先匹配。

location ^~ /tina-island/ {
    proxy_pass http://127.0.0.1:4330;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
