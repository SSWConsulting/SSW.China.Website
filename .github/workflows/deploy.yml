# main 更新 → 云端构建 → 服务器拷贝到站点目录。
#
# 两个 job：
# - build：跑在 GitHub 托管的 ubuntu-latest 上，装依赖、校验、构建，把 dist 上传为 artifact。
# - publish：跑在服务器本机的 self-hosted runner 上，只下载 artifact 并 robocopy 到 nginx 站点目录。
#   不需要 SSH、不需要密钥、服务器不用开任何入站端口，也不用装依赖、不用构建。
#
# 为什么不在服务器上构建（DECISIONS §110）：tinacms build 要在本机起 datalayer 服务并用回环连接它，
# 这台服务器上该连接每次都被切断（Connection to leader lost，换端口无效）；
# 且国内拉 npm 依赖要 7 分钟左右。
#
# 设计说明：docs/superpowers/specs/2026-09-22-ci-cd-design.md
# 服务器配置步骤：docs/DEPLOY-SETUP.md

name: 构建并发布

on:
  # 只监听 main 的 push（PR 合并也会触发）。
  # 刻意不对 PR 触发 —— 未合并的代码不应在生产服务器上执行。
  push:
    branches: [main]
  # 允许在 GitHub 页面上手动重跑（回滚或排查时用）。
  workflow_dispatch:

# 同时只跑一个部署。连续合并两个 PR 时，避免两次 robocopy 互相打架。
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 两个 job 都只需要读代码、读写本次运行的 artifact。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 构建慢于 15 分钟必然是卡住了。
    timeout-minutes: 15

    env:
      # TinaCMS 编辑后台（/admin/）连接 TinaCloud 所需的凭据，配置见 docs/TINACMS.md。
      # 未配置时 scripts/build-admin.mjs 会跳过后台，网站照常构建发布。
      PUBLIC_TINA_CLIENT_ID: ${{ secrets.PUBLIC_TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 发布门禁：任一步失败则终止，publish 不会执行，线上保持上一个版本。
      # 在 Linux 上检出没有 CRLF 问题，format:check / seo:check 也一并把关
      # （以前在 Windows runner 上构建时只能跳过这两项）。
      - name: 格式检查
        run: npm run format:check

      - name: 对比度检查
        run: npm run contrast

      # npm run build = 类型检查（astro check）→ 编辑后台（tinacms build）→ astro build，
      # 沿用项目自己的定义，以后 build 脚本改了这里会自动跟上。
      # 页面文案来自 content/ 下的 JSON（TinaCloud 把后台的编辑提交到 main，触发本流程）；
      # 文案缺必填项时 astro build 会失败，线上保持上一个版本。
      - name: 构建
        run: npm run build

      # 可视化编辑的预览服务（DECISIONS §117）：预览页进 dist/admin/preview/，
      # Node 服务在 dist-island/server/，发布到服务器上由 supervisor 常驻运行。
      - name: 构建预览服务
        run: npm run build:island-server

      # 冒烟测试：在没有 node_modules 的目录里起服务，请求一次首页首屏，
      # 拿到带 data-tina-field 的 HTML 才算能用（能从 TinaCloud 读到内容、依赖都已打包）。
      - name: 预览服务冒烟测试
        run: |
          mkdir -p /tmp/island/client
          cp -R dist-island/server /tmp/island/server
          (cd /tmp/island && HOST=127.0.0.1 PORT=4330 node server/entry.mjs > /tmp/island.log 2>&1 &)
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:4330/ && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:4330/tina-island/hero \
            -H 'content-type: application/x-tina-preview+json' -d '{}' > /tmp/hero.html \
            || { cat /tmp/island.log; exit 1; }
          grep -q 'data-tina-field' /tmp/hero.html || { cat /tmp/hero.html /tmp/island.log; exit 1; }

      - name: SEO 检查
        run: npm run seo:check

      # 构建产物必须存在才上传 —— 防止构建因故没产出 dist 却返回成功，
      # 导致服务器把空目录镜像上去、把线上站点清空。
      - name: 确认产物存在
        run: test -f dist/index.html

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: 准备预览服务产物
        run: cp deploy/island-server/supervisor.mjs dist-island/

      - name: 上传预览服务
        uses: actions/upload-artifact@v5
        with:
          name: island-server
          path: |
            dist-island/server
            dist-island/supervisor.mjs
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: [self-hosted, windows, sswcn]
    timeout-minutes: 10

    env:
      DEPLOY_TARGET: C:\SSW\Nginx\html\sswchina
      # 预览服务目录（DECISIONS §117，安装步骤见 docs/DEPLOY-SETUP.md）。不存在时跳过，不影响网站发布。
      ISLAND_TARGET: C:\SSW\island-server

    # 注意：以下 PowerShell 步骤内的字符串一律用英文。
    # Windows PowerShell 5.1 按系统 ANSI 编码（中文系统为 GBK）读取 GitHub
    # 生成的 UTF-8 脚本文件，中文会乱码成非法字符导致引号失配、解析失败。
    #
    # 产物下载到 runner 的临时目录（RUNNER_TEMP\site）并先清空：工作目录里可能残留
    # 以前在服务器上构建时的 dist，混进去的旧文件会被 /MIR 一起发布出去。
    steps:
      - name: 清空下载目录
        shell: powershell
        run: |
          if (Test-Path "$env:RUNNER_TEMP\site") { Remove-Item "$env:RUNNER_TEMP\site" -Recurse -Force }
          if (Test-Path "$env:RUNNER_TEMP\island") { Remove-Item "$env:RUNNER_TEMP\island" -Recurse -Force }

      - name: 下载产物
        uses: actions/download-artifact@v5
        with:
          name: site
          path: ${{ runner.temp }}/site

      # 再确认一次：下载的产物不完整时宁可失败，也不要镜像一个残缺目录上线。
      - name: 确认产物存在
        shell: powershell
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\site\index.html")) {
            Write-Error "index.html not found in downloaded artifact, aborting deploy"
            exit 1
          }

      # robocopy /MIR 镜像同步：新增的加上、删掉的删掉、没变的跳过。
      # 注意 robocopy 的退出码不遵循常规约定：0-7 都是成功（含"有文件被复制"
      # 和"有文件被删除"），8 及以上才是真失败。不做转换的话 CI 会误报。
      - name: 发布到站点目录
        shell: powershell
        run: |
          robocopy "$env:RUNNER_TEMP\site" "$env:DEPLOY_TARGET" /MIR /NFL /NDL /NJH /NP /R:2 /W:2
          $code = $LASTEXITCODE
          if ($code -ge 8) {
            Write-Error "robocopy failed with exit code $code"
            exit $code
          }
          Write-Host "Deploy complete. robocopy exit code $code (less than 8 means success)"
          exit 0

      # 网站发布完再更新预览服务：这一步出问题不影响网站。
      # 只镜像 server\ 目录；supervisor 发现文件变化后自动重启服务（不需要停止/启动服务的权限）。
      - name: 下载预览服务
        uses: actions/download-artifact@v5
        with:
          name: island-server
          path: ${{ runner.temp }}/island

      - name: 发布预览服务
        shell: powershell
        run: |
          if (-not (Test-Path "$env:ISLAND_TARGET")) {
            Write-Warning "$env:ISLAND_TARGET not found, island server not installed yet, skipping (see docs/DEPLOY-SETUP.md)"
            exit 0
          }
          if (-not (Test-Path "$env:RUNNER_TEMP\island\server\entry.mjs")) {
            Write-Error "entry.mjs not found in downloaded island-server artifact"
            exit 1
          }
          Copy-Item "$env:RUNNER_TEMP\island\supervisor.mjs" "$env:ISLAND_TARGET\supervisor.mjs" -Force
          robocopy "$env:RUNNER_TEMP\island\server" "$env:ISLAND_TARGET\server" /MIR /NFL /NDL /NJH /NP /R:2 /W:2
          $code = $LASTEXITCODE
          if ($code -ge 8) {
            Write-Error "robocopy failed with exit code $code"
            exit $code
          }
          Write-Host "Island server updated. robocopy exit code $code (less than 8 means success)"
          exit 0
