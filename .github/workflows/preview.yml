# main 更新 → 构建可视化编辑预览站 → 部署到 Vercel（公司团队的 ssw-china-preview 项目）。
#
# 不用 Vercel 的 GitHub 集成：组织已授权，Vercel 导入页仍找不到本仓库（2026-10-27），
# 改由这里用 Vercel CLI 构建并上传（DECISIONS §112）。与 ssw.cn 的发布（deploy.yml）互不影响。
#
# 需要的配置（仓库 Settings → Secrets and variables → Actions）：
# - secret   VERCEL_TOKEN   Vercel 账号设置里创建、Scope 为公司团队的 token
# - variable VERCEL_SCOPE   公司团队的 slug（vercel.com/<slug>）
# - secret   PUBLIC_TINA_CLIENT_ID / TINA_TOKEN   与 ssw.cn 共用
# 未配置 Vercel 的两项时跳过并给出提示，不算失败。

name: 预览站（Vercel）

on:
  push:
    branches: [main]
  workflow_dispatch:

# 连续保存时只部署最新的一次。
concurrency:
  group: deploy-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PUBLIC_TINA_CLIENT_ID: ${{ secrets.PUBLIC_TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VERCEL_PROJECT: ssw-china-preview
      # 固定 CLI 版本，升级时手动改。
      VERCEL_CLI: vercel@64.3.1

    steps:
      - name: 检查配置
        id: config
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_SCOPE" ]; then
            echo "::notice::VERCEL_TOKEN or VERCEL_SCOPE is not set, skipping the preview deploy (see docs/TINACMS.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取代码
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: 安装 Node
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        if: steps.config.outputs.ready == 'true'
        run: npm ci

      # 第一次运行时在团队下建项目，之后直接关联。
      - name: 关联 Vercel 项目
        if: steps.config.outputs.ready == 'true'
        run: |
          V="npx --yes $VERCEL_CLI --token $VERCEL_TOKEN --scope $VERCEL_SCOPE"
          $V project inspect "$VERCEL_PROJECT" > /dev/null 2>&1 || $V project create "$VERCEL_PROJECT"
          $V link --yes --project "$VERCEL_PROJECT"
          $V pull --yes --environment=production

      # vercel build 执行 vercel.json 的 buildCommand（npm run build:preview），
      # Tina 凭据直接取自上面的 env，不需要在 Vercel 项目里另配环境变量。
      - name: 构建
        if: steps.config.outputs.ready == 'true'
        run: npx --yes $VERCEL_CLI build --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

      - name: 部署
        if: steps.config.outputs.ready == 'true'
        run: |
          url=$(npx --yes $VERCEL_CLI deploy --prebuilt --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE")
          echo "Deployed: $url"
          echo "### 预览站已部署" >> "$GITHUB_STEP_SUMMARY"
          echo "本次部署：$url（固定域名见 Vercel 项目的 Domains，后台在该域名的 /admin/）" >> "$GITHUB_STEP_SUMMARY"
